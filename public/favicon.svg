<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141A" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Tech Core Isometric Hex / Cube -->
  <!-- Top Face -->
  <polygon points="32,14 46,22 32,30 18,22" fill="#FDE68A" opacity="0.95" />
  <!-- Left Face -->
  <polygon points="18,22 32,30 32,46 18,38" fill="#F59E0B" opacity="0.85" />
  <!-- Right Face -->
  <polygon points="32,30 46,22 46,38 32,46" fill="#D97706" opacity="0.95" />

  <!-- Center Core Node -->
  <circle cx="32" cy="30" r="3" fill="#FFFFFF" />

  <!-- Inner Circuit Lines -->
  <line x1="32" y1="14" x2="32" y2="8" stroke="#FDE68A" stroke-width="1.5" stroke-linecap="round" />
  <line x1="46" y1="38" x2="52" y2="42" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />
  <line x1="18" y1="38" x2="12" y2="42" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />
</svg>